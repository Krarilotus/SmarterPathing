assassins_resume: Assassinen setzen Befehl nach einem Kampf fort
assassins_resume_tooltip: |-
  Wenn ausgesandte Assassinen auf Feinde treffen und kämpfen, ziehen sie nach dem Kampf weiter zu ihrem ursprünglichen Ziel und erklimmen unterwegs weiterhin Mauern wie zuvor. Ohne diese Option blieben sie oft einfach dort stehen, wo der Kampf endete.
assassins_shortcut: Assassinen klettern nur bei deutlicher Abkürzung
assassins_shortcut_tooltip: |-
  Assassinen suchen zuerst nach einem Weg am Boden. Kurze Wege werden immer gelaufen. Bei einem langen Fußweg prüfen sie zusätzlich den Weg über Mauern und klettern nur, wenn dieser deutlich kürzer ist. Kein unnötiges Auf- und Abklettern mehr, wenn ein Umweg zu Fuß genügt.
workers_unstuck: Arbeiter in der Pause bleiben nicht mehr stecken
workers_unstuck_tooltip: |-
  Arbeiter in der Pause laufen zu einem Garten, Maibaum oder einem anderen schönen Gebäude. Wurde ihr Weg dorthin blockiert, blieben sie früher endlos stehen und kehrten nie zur Arbeit zurück. Nun suchen sie ein anderes Ziel oder gehen nach Pausenende zurück an die Arbeit.
workers_jobs_unstuck: Auf dem Arbeitsweg steckengebliebene Arbeiter werden ersetzt
workers_jobs_unstuck_tooltip: |-
  Ein Arbeiter, dessen Weg zur Arbeit, zum Vorratslager oder zum Kornspeicher dauerhaft blockiert war, blieb früher endlos stehen. Nun gibt er nach etwa fünf Sekunden fehlgeschlagener Versuche auf die spielübliche Weise auf, und ein neuer Arbeiter rückt vom Lagerfeuer nach. Getragene Güter gehen dabei wie im Originalspiel verloren.
ignore_quarry_piles: Aggressive Truppen lassen Steinbruch-Lager in Ruhe
ignore_quarry_piles_tooltip: Truppen in aggressiver Haltung greifen nicht mehr von selbst feindliche Steinbruch-Lager (den Steinhaufen neben einem Steinbruch) an, genau wie sie bereits das Haupt-Vorratslager ignorieren. Manuell kannst du sie weiterhin darauf ansetzen.
rebuild_limit: Fehlgeschlagene Routen bauen nicht die ganze Karte neu auf
rebuild_limit_tooltip: |-
  Kann die Route einer Einheit nicht berechnet werden (an einer Stelle mit Einbahnwegen), baut das Spiel alle Pfade der gesamten Karte neu auf, bevor es aufgibt – und kurz darauf versucht es die Einheit erneut, sodass eine Handvoll blockierter Einheiten das Spiel zum Ruckeln bringt. Nun geschieht dieser Neuaufbau höchstens im eingestellten Abstand; dazwischen schlägt die Route einfach kostenfrei fehl.
