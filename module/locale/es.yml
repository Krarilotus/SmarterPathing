assassins_resume: Los asesinos continúan su marcha tras un combate
assassins_resume_tooltip: |-
  Cuando los asesinos que enviaste a un lugar se cruzan con enemigos y luchan, siguen hacia su destino en cuanto acaba el combate, trepando muros como antes. Sin esto, a menudo se detenían donde terminaba la pelea.
assassins_shortcut: Los asesinos solo trepan si es claramente más corto
assassins_shortcut_tooltip: |-
  Los asesinos buscan primero un camino por tierra y siempre recorren a pie un trayecto corto. Si el recorrido es largo, comprueban también el camino por los muros y solo trepan si ahorra claramente camino. Se acabó subir y bajar muros cuando basta rodear.
workers_unstuck: Los trabajadores en descanso no se atascan
workers_unstuck_tooltip: |-
  Los trabajadores en descanso caminan hacia un jardín, un palo de mayo u otro edificio agradable. Si su camino quedaba bloqueado, antes se quedaban intentándolo para siempre sin volver al trabajo. Ahora eligen otro lugar o vuelven a trabajar al terminar su descanso.
workers_jobs_unstuck: Los trabajadores atascados de camino al trabajo se sustituyen
workers_jobs_unstuck_tooltip: |-
  Un trabajador cuyo camino al trabajo, al almacén o al granero seguía bloqueado antes se quedaba intentándolo para siempre. Ahora, tras unos cinco segundos de intentos fallidos, abandona del modo habitual del juego y acude un nuevo trabajador desde la hoguera. Lo que llevaba encima se pierde, igual que en el juego original.
ignore_quarry_piles: Las tropas agresivas ignoran los depósitos de cantera
ignore_quarry_piles_tooltip: Las tropas en postura agresiva ya no se desvían por sí solas a atacar el depósito de piedra junto a una cantera enemiga, igual que ya ignoran el almacén principal. Aún puedes ordenarles atacarlo.
rebuild_limit: Las rutas fallidas no reconstruyen todo el mapa
rebuild_limit_tooltip: |-
  Cuando no puede trazarse la ruta de una unidad (un punto con caminos de un solo sentido), el juego reconstruye todas las rutas del mapa antes de rendirse, y la unidad vuelve a intentarlo al poco tiempo, de modo que unas pocas unidades atascadas ralentizan toda la partida. Ahora esa reconstrucción ocurre como mucho cada cierto tiempo; entre tanto la ruta simplemente falla sin coste.
